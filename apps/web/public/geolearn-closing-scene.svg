<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">GeoLearn landscape scene</title>
  <desc id="desc">A soft landscape with mountains, city skyline and students, used as a decorative closing visual.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf7fb"/>
      <stop offset=".55" stop-color="#dceff5"/>
      <stop offset="1" stop-color="#d4e8ec"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fbeb7"/>
      <stop offset="1" stop-color="#b7ceca"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#557c72"/>
      <stop offset="1" stop-color="#789a8f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54756b"/>
      <stop offset="1" stop-color="#35594f"/>
    </linearGradient>
    <linearGradient id="student" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e4d5b"/>
      <stop offset="1" stop-color="#1b3442"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#sky)"/>
  <circle cx="1210" cy="120" r="180" fill="#ffffff" opacity=".32" filter="url(#soft)"/>

