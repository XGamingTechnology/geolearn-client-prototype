<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b5f55" />
  <meta name="description" content="GeoLearn — prototype statis QuizInLearning berbasis WebGIS untuk siswa SMA." />
  <title>GeoLearn — Interactive WebGIS Learning Prototype</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://tile.openstreetmap.org" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="app-shell" class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img"><path d="M24 5c-8.4 0-15.3 6.2-16.4 14.3C6.6 27 13 35.2 24 43c11-7.8 17.4-16 16.4-23.7C39.3 11.2 32.4 5 24 5Z" fill="currentColor" opacity=".16"/><path d="M14 19.5c4.3-1.9 8.2-2.1 11.5-.7 3.4 1.4 6.1 1.1 8.2-.8M14 27c4.4-1.4 8.2-1.3 11.3.4 3 1.7 5.8 1.7 8.7.1M24 10c-3.3 5.6-4.1 11.1-2.2 16.5 1.2 3.4 1.2 6.4.2 9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
        <div><strong>GeoLearn</strong><span>WebGIS Learning</span></div>
      </div>

      <nav class="nav-list">
        <button class="nav-item active" data-route="dashboard">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg></span>
          Beranda
        </button>
        <button class="nav-item" data-route="question-bank">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14l-7-3-7 3V5a2 2 0 0 1 2-2Z"/></svg></span>
          Quiz & Soal
        </button>
        <button class="nav-item" data-route="map-lab">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Zm6-3v15m6-12v15" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
          Peta & Data
        </button>
        <button class="nav-item" data-route="results">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 20V10m7 10V4m7 16v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          Hasil Belajar
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-route="builder">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          Question Builder
          <span class="nav-badge">Demo</span>
        </button>
      </nav>

      <div class="sidebar-note">
        <span class="status-dot"></span>
        <div><strong>Prototype v0.1</strong><small>Client review · data simulasi</small></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Buka menu">☰</button>
        <div class="breadcrumbs" id="breadcrumbs">GeoLearn / <strong>Beranda</strong></div>
        <div class="topbar-actions">
          <span class="prototype-pill">STATIC PROTOTYPE</span>
          <div class="avatar">S</div>
          <div class="student-name"><strong>Siswa Demo</strong><span>Kelas XI</span></div>
        </div>
      </header>

      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
