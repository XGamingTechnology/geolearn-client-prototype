name: geolearn-staging

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_ARCGIS_API_KEY: ${NEXT_PUBLIC_ARCGIS_API_KEY:-}
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
        NEXT_PUBLIC_CARTO_API_KEY: ${NEXT_PUBLIC_CARTO_API_KEY:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      APP_ENV: staging
      MEDIA_STORAGE_PATH: /var/lib/geolearn/media
      MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES:-10485760}
      MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-104857600}
      RASTER_SERVICE_URL: ${RASTER_SERVICE_URL:-http://raster:8000}
      RASTER_STORAGE_PATH: ${RASTER_STORAGE_PATH:-/var/lib/geolearn/raster}
      RASTER_MAX_UPLOAD_BYTES: ${RASTER_MAX_UPLOAD_BYTES:-268435456}
      RASTER_TILE_SIGNING_SECRET: ${RASTER_TILE_SIGNING_SECRET}
    volumes:
      - staging_media:/var/lib/geolearn/media
      - staging_raster:/var/lib/geolearn/raster
    ports:
      - "127.0.0.1:3101:3000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      raster:
        condition: service_healthy
    networks: [staging_app, staging_edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    networks: [staging_app]

  raster:
    build:
      context: ../services/raster
    restart: unless-stopped
    volumes:
      - staging_raster:/data
    networks: [staging_app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  database:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [staging_app]

volumes:
  staging_postgres:
    name: geolearn_staging_postgres
  staging_media:
    name: geolearn_staging_media
  staging_raster:
    name: geolearn_staging_raster

networks:
  staging_app:
    name: geolearn_staging_app
    internal: true
  staging_edge:
    name: geolearn_staging_edge
